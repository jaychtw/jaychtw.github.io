name: Validate release candidate
on:
  push:
    branches: [main, "platform/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate and preserve the original exit status
        run: |
          mkdir -p .artifacts
          set -o pipefail
          npm run release:check 2>&1 | tee .artifacts/validation.log
      - name: Expose actionable failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          result=Path('.artifacts/browser/results.json')
          message=json.loads(result.read_text()).get('failure') if result.exists() else None
          log=Path('.artifacts/validation.log')
          message=message or (log.read_text()[-6000:] if log.exists() else 'Validation failed before the runner produced a log.')
          escaped=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::error title=Release validation diagnostic::'+escaped)
          PY
      - name: Save reviewed release and evidence (no deployment)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: possibility-review-${{ github.sha }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 30
