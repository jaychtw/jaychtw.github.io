name: Deploy accepted Republic of Chickens v1.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the accepted release, not a moving branch
        uses: actions/checkout@v4
        with:
          ref: 4ad62e03ef16242b995105e2e5c0c7caf63b9d73
          persist-credentials: false

      - name: Verify and extract the accepted build
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('dist').resolve()
          root.mkdir(exist_ok=True)
          with ZipFile('release/republic-of-chickens-v1.0.zip') as archive:
              assert archive.testzip() is None, 'Release archive integrity check failed'
              for member in archive.infolist():
                  assert (root / member.filename).resolve().is_relative_to(root)
              archive.extractall(root)
          assert (root / 'index.html').is_file()
          assert (root / '.nojekyll').is_file()
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the accepted static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set up Node for public-site verification
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned verification tools
        run: |
          npm ci --no-fund
          npx playwright install --with-deps chromium

      - name: Verify the deployed URL, assets, language and five hall routes
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium, expect } from '@playwright/test';
          const url = process.env.PUBLIC_URL;
          const target = new URL(url);
          if (target.protocol !== 'https:' || target.hostname !== 'jaychtw.github.io' || target.pathname.replace(/\/$/, '') !== '/reppublic-of-chickens') throw new Error('Unexpected deployment URL');
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            const failed = [], errors = [];
            page.on('response', response => { if (response.status() >= 400) failed.push(`${response.status()} ${response.url()}`); });
            page.on('requestfailed', request => {
              const error = request.failure()?.errorText || '';
              if (!error.includes('ERR_ABORTED')) failed.push(`${error} ${request.url()}`);
            });
            page.on('pageerror', error => errors.push(error.message));
            const response = await page.goto(url, { waitUntil: 'networkidle' });
            expect(response.status()).toBe(200);
            await expect(page.locator('.hall-marker')).toHaveCount(5);
            for (const hall of ['town', 'mess', 'social', 'residential', 'welfare']) {
              await page.getByTestId(`enter-${hall}`).click();
              await expect(page.locator('main h1')).toBeVisible();
              await page.reload({ waitUntil: 'networkidle' });
              await expect(page.locator('main h1')).toBeVisible();
              if (hall === 'town') {
                await page.getByRole('button', { name: 'Next', exact: true }).click();
                await expect(page.locator('.dialogue-top')).toContainText('2/42');
              }
              await page.getByRole('button', { name: 'Return to republic', exact: true }).last().click();
            }
            for (const file of ['republic.png', 'citizens.png', 'residence.png', 'repairs.png', 'crossroads.png']) {
              const asset = await page.request.get(new URL(`art/${file}`, url).href);
              expect(asset.status()).toBe(200);
              expect(asset.headers()['content-type']).toContain('image/png');
            }
            await page.getByRole('button', { name: '繁體中文', exact: true }).click();
            await page.reload({ waitUntil: 'networkidle' });
            await expect(page.locator('html')).toHaveAttribute('lang', 'zh-TW');
            await expect(page.locator('.wordmark')).toContainText('雞窩共和國');
            await page.evaluate(() => document.fonts.ready);
            expect(failed).toEqual([]);
            expect(errors).toEqual([]);
            console.log(`VERIFIED: ${url} — HTTP 200, all five hall routes and reloads, five art assets, debate interaction and persisted zh-TW.`);
          } finally { await browser.close(); }
          JS

      - name: Record deployment outcome
        if: success()
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo '### Republic of Chickens v1.0 deployed and verified' >> "$GITHUB_STEP_SUMMARY"
          echo "Public URL: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Accepted game commit: 4ad62e03ef16242b995105e2e5c0c7caf63b9d73' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verification: HTTP 200, all five hall routes and reloads, five art assets, debate interaction, and persisted zh-TW.' >> "$GITHUB_STEP_SUMMARY"
